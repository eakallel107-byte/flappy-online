<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#70c5ce">
<title>Flappy Bird Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#222;font-family:Arial,sans-serif;touch-action:none;position:fixed;inset:0;overscroll-behavior:none}
#c{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
#game{position:relative;width:100%;height:100%;max-width:500px;overflow:hidden;background:#70c5ce}
canvas{display:block;width:100%;height:100%}
#score{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:48px;font-weight:bold;color:#fff;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:10}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.7);color:#fff;text-align:center;z-index:20;padding:20px;overflow-y:auto}
h1{font-size:30px;margin-bottom:15px;text-shadow:3px 3px 0 #000}
h2{font-size:22px;margin-bottom:12px;text-shadow:2px 2px 0 #000}
p{font-size:16px;margin-bottom:18px;line-height:1.6;text-shadow:2px 2px 0 #000}
button{padding:14px 35px;font-size:19px;font-weight:bold;background:linear-gradient(180deg,#ffe45c,#f7d51d);color:#333;border:4px solid #333;border-radius:12px;cursor:pointer;box-shadow:0 5px 0 #b39b00;margin:8px;font-family:Arial;-webkit-appearance:none;transition:transform .05s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b39b00}
.btn2{background:linear-gradient(180deg,#8ed4ff,#4ea8e0);box-shadow:0 5px 0 #2a6b99;color:#fff}
.btn3{background:linear-gradient(180deg,#ff8a8a,#e04040);box-shadow:0 5px 0 #992020;color:#fff}
input{padding:12px;font-size:20px;text-align:center;border:3px solid #333;border-radius:10px;width:200px;margin:8px;font-weight:bold;text-transform:uppercase;letter-spacing:3px}
#code{font-size:40px;font-weight:bold;color:#f7d51d;letter-spacing:8px;background:#222;padding:15px 25px;border-radius:12px;border:3px solid #f7d51d;margin:15px;text-shadow:0 0 15px #f7d51d}
#roomInfo{font-size:18px;margin:15px;line-height:1.8}
.ready{color:#4eff4e;font-weight:bold}
.waiting{color:#ffaa00}
#error{color:#ff5555;font-size:16px;margin:10px;min-height:20px}
#best{font-size:16px;color:#fff;margin:8px}
#finalScore{font-size:30px;color:#f7d51d;margin:10px;font-weight:bold}
#players{position:absolute;top:80px;right:10px;color:#fff;font-size:14px;text-align:right;text-shadow:2px 2px 0 #000;z-index:9}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="c"><div id="game">
<canvas id="cv"></canvas>
<div id="score" class="hidden">0</div>
<div id="players"></div>

<!-- شاشة البداية الرئيسية -->
<div class="scr" id="mainMenu">
  <h1>🐦 Flappy Bird</h1>
  <button id="btnSingle">🎮 لعب فردي</button>
  <button id="btnOnline" class="btn2">🌐 Play Online</button>
</div>

<!-- شاشة أونلاين -->
<div class="scr hidden" id="onlineMenu">
  <h1>🌐 أونلاين</h1>
  <button id="btnCreate" class="btn2">➕ Create Room</button>
  <button id="btnJoin" class="btn3">🔗 Join Room</button>
  <button id="btnBack" style="background:#999;box-shadow:0 5px 0 #555">← رجوع</button>
</div>

<!-- شاشة إنشاء غرفة -->
<div class="scr hidden" id="createScreen">
  <h1>➕ غرفة جديدة</h1>
  <p>شارك هذا الكود مع صاحبك:</p>
  <div id="code">----</div>
  <div id="roomInfo"></div>
  <button id="btnReady1" class="btn2">✅ Ready</button>
  <button id="btnCancel1" style="background:#999;box-shadow:0 5px 0 #555">← إلغاء</button>
</div>

<!-- شاشة انضمام لغرفة -->
<div class="scr hidden" id="joinScreen">
  <h1>🔗 انضم لغرفة</h1>
  <p>اكتب الكود:</p>
  <input id="inputCode" maxlength="4" placeholder="XXXX" autocomplete="off">
  <div id="error"></div>
  <button id="btnJoinGo" class="btn2">دخول</button>
  <button id="btnCancel2" style="background:#999;box-shadow:0 5px 0 #555">← رجوع</button>
</div>

<!-- شاشة الانتظار -->
<div class="scr hidden" id="waitScreen">
  <h1>⏳ غرفة <span id="waitCode"></span></h1>
  <div id="roomInfo2"></div>
  <button id="btnReady2" class="btn2">✅ Ready</button>
  <button id="btnLeave" style="background:#999;box-shadow:0 5px 0 #555">← خروج</button>
</div>

<!-- شاشة النهاية -->
<div class="scr hidden" id="gameOver">
  <h1>انتهت اللعبة!</h1>
  <div id="finalScore">النقاط: 0</div>
  <div id="best">أفضل نتيجة: 0</div>
  <button id="btnRestart" class="btn2">🔄 العب مرة أخرى</button>
  <button id="btnMainMenu" style="background:#999;box-shadow:0 5px 0 #555">🏠 القائمة الرئيسية</button>
</div>

</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
"use strict";

/* ===== المتغيرات ===== */
var socket=null;
var cv,ctx,scoreEl,playersEl;
var W=0,H=0;
var bird,pipes=[],score=0,fr=0,gx=0;
var G=0.5,J=-8,PW=70,PG=170,PS=2.5;
var mode='menu'; // menu, single, online
var run=false,over=false;
var lastTime=0,acc=0,STEP=1000/60;
var myCode=null,myId=null;
var remotePlayers=[],remotePipes=[];
var readyState=0; // 0=not ready, 1=ready
var best=0;

function $(id){return document.getElementById(id)}
function show(id){var e=$(id);if(e)e.classList.remove('hidden')}
function hide(id){var e=$(id);if(e)e.classList.add('hidden')}
function hideAll(){var s=document.querySelectorAll('.scr');for(var i=0;i<s.length;i++)s[i].classList.add('hidden')}

/* ===== أفضل نتيجة ===== */
try{best=parseInt(localStorage.getItem('fb_best')||'0',10)||0}catch(e){best=0}
function saveBest(){try{localStorage.setItem('fb_best',String(best))}catch(e){}}

/* ===== حجم Canvas ===== */
function rs(){
  if(!cv)return;
  var r=cv.getBoundingClientRect();
  var w=Math.max(1,Math.floor(r.width));
  var h=Math.max(1,Math.floor(r.height));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  W=cv.width;H=cv.height;
}

/* ===== إعادة الضبط ===== */
function reset(){
  rs();
  bird={x:W*0.28,y:H*0.45,sz:Math.max(24,Math.min(34,W*0.09)),v:0,rot:0,alive:true};
  pipes=[];
  score=0;fr=0;over=false;gx=0;
  if(scoreEl)scoreEl.textContent='0';
}

/* ===== توليد أنبوب (فردي) ===== */
function spawnSingle(){
  var mn=H*0.12,mx=H-PG-H*0.18;
  if(mx<mn)mx=mn+50;
  var th=Math.random()*(mx-mn)+mn;
  pipes.push({x:W+20,th:th,sc:false});
}

/* ===== رسم الطائر ===== */
function drawBird(x,y,sz,rot,alpha,color){
  ctx.save();
  ctx.globalAlpha=alpha||1;
  ctx.translate(x,y);
  ctx.rotate(rot||0);
  ctx.fillStyle=color||'#f7d51d';
  ctx.beginPath();ctx.arc(0,0,sz/2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(sz/4,-sz/6,sz/5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#333';ctx.stroke();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(sz/4+2,-sz/6,sz/10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f77d1d';
  ctx.beginPath();
  ctx.moveTo(sz/2-2,-2);ctx.lineTo(sz/2+11,2);ctx.lineTo(sz/2-2,8);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}

/* ===== رسم الأنابيب ===== */
function drawPipes(pipeList,alpha){
  ctx.globalAlpha=alpha||1;
  for(var i=0;i<pipeList.length;i++){
    var p=pipeList[i];
    var px=p.x*W;
    var ptop=p.top*H;
    var pgap=p.gap*H;
    var pwid=PW;
    var g=ctx.createLinearGradient(px,0,px+pwid,0);
    g.addColorStop(0,'#6fc96f');g.addColorStop(0.5,'#5eb45e');g.addColorStop(1,'#4a9a4a');
    ctx.fillStyle=g;
    ctx.fillRect(px,0,pwid,ptop);
    ctx.strokeStyle='#2d6b2d';ctx.lineWidth=3;
    ctx.strokeRect(px,0,pwid,ptop);
    ctx.fillStyle='#7ddc7d';
    ctx.fillRect(px-5,ptop-30,pwid+10,30);
    ctx.strokeRect(px-5,ptop-30,pwid+10,30);
    var by=ptop+pgap;
    var bh=H-by;
    ctx.fillStyle=g;
    ctx.fillRect(px,by,pwid,bh);
    ctx.strokeRect(px,by,pwid,bh);
    ctx.fillStyle='#7ddc7d';
    ctx.fillRect(px-5,by,pwid+10,30);
    ctx.strokeRect(px-5,by,pwid+10,30);
  }
  ctx.globalAlpha=1;
}

/* ===== الأرض ===== */
function drawGround(){
  ctx.fillStyle='#ded895';ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle='#a8b545';ctx.fillRect(0,H-40,W,8);
  ctx.strokeStyle='#c4b96b';ctx.lineWidth=2;
  for(var i=-50;i<W+50;i+=40){
    var x=((i+gx)%(W+80))-40;
    ctx.beginPath();ctx.moveTo(x,H-20);ctx.lineTo(x+20,H-20);ctx.stroke();
  }
}

/* ===== السماء والسحاب ===== */
function drawSky(){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#4ec0e0');
  sky.addColorStop(1,'#70c5ce');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';
  var co=(fr*0.3)%(W+200);
  drawCloud(W-co+50,80,40);
  drawCloud(W-co-150,140,30);
  drawCloud(W-co-350,60,35);
}
function drawCloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,s,0,Math.PI*2);
  ctx.arc(x+s,y-s/3,s*0.8,0,Math.PI*2);
  ctx.arc(x+s*1.8,y,s*0.9,0,Math.PI*2);
  ctx.fill();
}

/* ===== الفردي: التحديث ===== */
function updSingle(){
  if(!run||over||!bird||!bird.alive)return;
  fr++;gx-=PS;
  bird.v+=G;
  bird.y+=bird.v;
  var tr=Math.max(-0.5,Math.min(1.2,bird.v*0.08));
  bird.rot+=(tr-bird.rot)*0.2;
  if(fr%95===0)spawnSingle();
  for(var i=pipes.length-1;i>=0;i--){
    var p=pipes[i];
    p.x-=PS;
    if(!p.sc&&p.x+PW<bird.x){
      p.sc=true;score++;
      if(scoreEl)scoreEl.textContent=score;
    }
    if(p.x+PW<-10){pipes.splice(i,1);continue}
    var bl=bird.x-bird.sz/3,br=bird.x+bird.sz/3;
    var bt=bird.y-bird.sz/3,bb=bird.y+bird.sz/3;
    if(br>p.x&&bl<p.x+PW&&(bt<p.th||bb>p.th+PG)){endSingle();return}
  }
  if(bird.y+bird.sz/2>=H-40){bird.y=H-40-bird.sz/2;endSingle();return}
  if(bird.y-bird.sz/2<=0){bird.y=bird.sz/2;bird.v=0}
}

/* ===== الفردي: الرسم ===== */
function drawSingle(){
  drawSky();
  drawPipes(pipes.map(function(p){return {x:p.x/W,top:p.th/H,gap:PG/H}}),1);
  drawGround();
  if(bird)drawBird(bird.x,bird.y,bird.sz,bird.rot,1,'#f7d51d');
}

/* ===== الأونلاين: الرسم ===== */
function drawOnline(){
  drawSky();
  // أنابيب مشتركة (نفسها للجميع)
  if(remotePipes.length){
    drawPipes(remotePipes,1);
  }
  drawGround();
  // اللاعبون الآخرون (شفافون)
  for(var i=0;i<remotePlayers.length;i++){
    var rp=remotePlayers[i];
    if(rp.id===myId)continue;
    drawBird(rp.x*W,rp.y*H,bird?bird.sz:30,0,0.45,'#ffffff');
  }
  // أنا
  if(bird)drawBird(bird.x,bird.y,bird.sz,bird.rot,1,'#f7d51d');
}

/* ===== الحلقة الرئيسية ===== */
function loop(now){
  requestAnimationFrame(loop);
  if(!now)now=performance.now?performance.now():Date.now();
  var dt=now-lastTime;lastTime=now;
  if(dt>100)dt=100;if(dt<0)dt=0;
  acc+=dt;
  while(acc>=STEP){
    if(mode==='single')updSingle();
    acc-=STEP;
  }
  if(mode==='single')drawSingle();
  else if(mode==='online')drawOnline();
}

/* ===== اللعب الفردي ===== */
function startSingle(){
  hideAll();
  mode='single';run=true;over=false;
  reset();
  if(scoreEl){scoreEl.classList.remove('hidden');scoreEl.textContent='0'}
  if(playersEl)playersEl.innerHTML='';
  var cvEl=$('cv');
  if(cvEl){cvEl.onmousedown=onTap;cvEl.ontouchstart=onTap}
}
function endSingle(){
  if(over)return;
  over=true;run=false;
  if(bird)bird.alive=false;
  if(score>best){best=score;saveBest()}
  var fsc=$('finalScore');if(fsc)fsc.textContent='النقاط: '+score;
  var bst=$('best');if(bst)bst.textContent='أفضل نتيجة: '+best;
  hideAll();show('gameOver');
}

/* ===== اللمس ===== */
function onTap(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(mode==='single'&&run&&!over&&bird){bird.v=J}
  if(mode==='online'&&run&&myCode&&socket){socket.emit('jump',myCode)}
}

/* ===== الأزرار ===== */
function bindBtns(){
  var b1=$('btnSingle');if(b1)b1.onclick=function(){startSingle()};
  var b2=$('btnOnline');if(b2)b2.onclick=function(){openOnline()};
  var b3=$('btnBack');if(b3)b3.onclick=function(){hideAll();show('mainMenu')};
  var b4=$('btnCreate');if(b4)b4.onclick=function(){createRoom()};
  var b5=$('btnJoin');if(b5)b5.onclick=function(){hideAll();show('joinScreen')};
  var b6=$('btnJoinGo');if(b6)b6.onclick=function(){joinRoom()};
  var b7=$('btnCancel1');if(b7)b7.onclick=function(){leaveRoom()};
  var b8=$('btnCancel2');if(b8)b8.onclick=function(){hideAll();show('onlineMenu')};
  var b9=$('btnReady1');if(b9)b9.onclick=function(){sendReady()};
  var b10=$('btnReady2');if(b10)b10.onclick=function(){sendReady()};
  var b11=$('btnLeave');if(b11)b11.onclick=function(){leaveRoom()};
  var b12=$('btnRestart');if(b12)b12.onclick=function(){startSingle()};
  var b13=$('btnMainMenu');if(b13)b13.onclick=function(){hideAll();show('mainMenu');mode='menu'};
}

/* ===== أونلاين: فتح القائمة ===== */
function openOnline(){
  if(!socket)initSocket();
  hideAll();show('onlineMenu');
}

/* ===== إنشاء غرفة ===== */
function createRoom(){
  if(!socket)initSocket();
  socket.emit('createRoom','لاعب 1');
}

/* ===== الانضمام ===== */
function joinRoom(){
  var code=$('inputCode').value.trim().toUpperCase();
  if(code.length!==4){
    var er=$('error');if(er)er.textContent='الكود لازم 4 أحرف';
    return;
  }
  if(!socket)initSocket();
  socket.emit('joinRoom',{code:code,name:'لاعب 2'});
}

/* ===== ready ===== */
function sendReady(){
  if(socket&&myCode)socket.emit('ready',myCode);
}

/* ===== مغادرة الغرفة ===== */
function leaveRoom(){
  if(socket&&myCode)socket.emit('leaveRoom',myCode);
  myCode=null;mode='menu';run=false;
  hideAll();show('mainMenu');
}

/* ===== Socket.IO ===== */
function initSocket(){
  if(typeof io==='undefined')return;
  socket=io();

  socket.on('roomCreated',function(data){
    myCode=data.code;myId=data.myId;
    var ce=$('code');if(ce)ce.textContent=data.code;
    var ri=$('roomInfo');if(ri)ri.innerHTML='في انتظار صاحبك...';
    hideAll();show('createScreen');
  });

  socket.on('roomJoined',function(data){
    myCode=data.code;myId=data.myId;
    var wc=$('waitCode');if(wc)wc.textContent=data.code;
    hideAll();show('waitScreen');
  });

  socket.on('playerList',function(players){
    var html='';
    for(var i=0;i<players.length;i++){
      html+='<div>'+players[i].name+' '+(players[i].ready?'<span class="ready">✅ جاهز</span>':'<span class="waiting">⏳ ينتظر</span>')+'</div>';
    }
    var ri=$('roomInfo');if(ri)ri.innerHTML=html;
    var ri2=$('roomInfo2');if(ri2)ri2.innerHTML=html;
  });

  socket.on('gameStart',function(){
    hideAll();
    if(scoreEl){scoreEl.classList.remove('hidden');scoreEl.textContent='0'}
    mode='online';run=true;over=false;
    score=0;fr=0;
    // إعادة ضبط الطائر
    rs();
    bird={x:W*0.28,y:H*0.45,sz:Math.max(24,Math.min(34,W*0.09)),v:0,rot:0,alive:true};
    var cvEl=$('cv');
    if(cvEl){cvEl.onmousedown=onTap;cvEl.ontouchstart=onTap}
  });

  socket.on('state',function(data){
    remotePlayers=data.players||[];
    remotePipes=data.pipes||[];
    // تحديث طياري من السيرفر
    for(var i=0;i<remotePlayers.length;i++){
      if(remotePlayers[i].id===myId&&bird){
        bird.y=remotePlayers[i].y*H;
        bird.v=remotePlayers[i].v*H*30;
        score=remotePlayers[i].score||0;
        if(scoreEl)scoreEl.textContent=score;
        if(remotePlayers[i].dead&&!over){
          over=true;run=false;
          if(score>best){best=score;saveBest()}
          var fsc=$('finalScore');if(fsc)fsc.textContent='النقاط: '+score;
          var bst=$('best');if(bst)bst.textContent='أفضل نتيجة: '+best;
          setTimeout(function(){hideAll();show('gameOver')},600);
        }
      }
    }
    // عرض معلومات اللاعبين
    if(playersEl){
      var html='';
      for(var j=0;j<remotePlayers.length;j++){
        var p=remotePlayers[j];
        var who=(p.id===myId)?'أنت':'صاحبك';
        html+='<div>'+who+': '+(p.score||0)+(p.dead?' 💀':'')+'</div>';
      }
      playersEl.innerHTML=html;
    }
  });

  socket.on('playerLeft',function(){
    myCode=null;mode='menu';run=false;
    hideAll();show('mainMenu');
  });

  socket.on('errorMsg',function(msg){
    var er=$('error');if(er)er.textContent=msg;
  });
}

/* ===== التهيئة ===== */
function init(){
  cv=$('cv');ctx=cv?cv.getContext('2d'):null;
  if(!cv||!ctx)return;
  scoreEl=$('score');
  playersEl=$('players');
  rs();
  reset();
  bindBtns();
  hideAll();show('mainMenu');
  lastTime=performance.now?performance.now():Date.now();
  requestAnimationFrame(loop);
  window.addEventListener('resize',rs,false);
  window.addEventListener('orientationchange',function(){setTimeout(rs,250)},false);
  // تهيئة Socket مسبقاً
  if(typeof io!=='undefined'){try{initSocket()}catch(e){}}
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init,false);
}else{
  init();
}
})();
</script>
</body>
</html>
